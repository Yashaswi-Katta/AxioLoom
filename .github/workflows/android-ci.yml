name: AxioLoom Android CI & APK Builder

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build APK & Run JUnit Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11 & Generate Synthetic ONNX Verification Assets
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure Bundled HMER Vocabulary & Synthetic ONNX Model Assets Exist
        run: |
          mkdir -p /tmp/hmer_synthetic
          if [ -f "tools/hmer_export/export_hmer_to_onnx.py" ]; then
            pip install --quiet onnx numpy
            python tools/hmer_export/export_hmer_to_onnx.py --mode synthetic --output-dir /tmp/hmer_synthetic || true
          fi
          mkdir -p app/src/main/assets/hmer
          if [ -f "/tmp/hmer_synthetic/hmer_vocab.txt" ] && [ ! -f "app/src/main/assets/hmer/hmer_vocab.txt" ]; then
            cp /tmp/hmer_synthetic/hmer_vocab.txt app/src/main/assets/hmer/
          fi
          ls -la app/src/main/assets/hmer

      - name: Configure Android SDK & Accept Licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

          # Detect modern cmdline-tools sdkmanager
          SDK_DIR=""
          for cmd_dir in "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/cmdline-tools/16.0/bin" "$ANDROID_HOME/cmdline-tools/bin"; do
            if [ -x "$cmd_dir/sdkmanager" ]; then
              SDK_DIR="$cmd_dir"
              break
            fi
          done
          if [ -z "$SDK_DIR" ] && command -v sdkmanager >/dev/null 2>&1; then
            SDK_DIR=$(dirname "$(command -v sdkmanager)")
          fi

          if [ -n "$SDK_DIR" ]; then
            export PATH="$SDK_DIR:$PATH"
            echo "$SDK_DIR" >> $GITHUB_PATH
            echo "Found sdkmanager at: $SDK_DIR/sdkmanager"
            yes | "$SDK_DIR/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$SDK_DIR/sdkmanager" "platforms;android-35" "build-tools;35.0.0" || true
          else
            echo "sdkmanager not found directly; Gradle auto-download will handle SDK packages."
          fi

      - name: Verify Gradle Wrapper Script & JAR
        run: |
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::error::Gradle wrapper script (gradlew) or JAR is missing from checkout!"
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run Full JUnit Test Suite (Phases 1-31)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Compile Android Instrumentation Test Sources
        run: ./gradlew :app:compileDebugAndroidTestSources --stacktrace

      - name: Upload JUnit HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AxioLoom-Unit-Test-Report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

      - name: Setup Release Keystore
        run: |
          if [ -f "keystore/release.jks" ]; then
            echo "Using persistent repository release keystore"
            cp keystore/release.jks axioloom-release.jks
          else
            echo "Generating fallback keystore"
            keytool -genkeypair -v \
              -keystore axioloom-release.jks \
              -alias axioloom \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass axioloom123 \
              -keypass axioloom123 \
              -dname "CN=AxioLoom Offline, OU=Engineering, O=AxioLoom, L=Hyderabad, S=TS, C=IN"
          fi

      - name: Assemble Signed Debug & Release APKs
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/axioloom-release.jks
          KEYSTORE_PASSWORD: axioloom123
          KEY_ALIAS: axioloom
          KEY_PASSWORD: axioloom123
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload Installable Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AxioLoom-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Installable Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AxioLoom-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish GitHub Release on Tag (`v*`)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          generate_release_notes: true
